<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141827">
  <meta name="description" content="Visualizador HTML5 do salão DDTank, com navegação acessível e responsiva.">
  <title>Nova Flash HTML5 | Salão</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="toolbar">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Nova Flash <small>HTML5</small></strong><span class="subtitle">Salão interativo</span></div></div>
      <div class="toolbar-actions"><span id="assetStatus" class="asset-status" aria-live="polite">Carregando imagens…</span><button type="button" id="fitBtn" title="Ajustar à tela">⤢ <span>Ajustar</span></button><button type="button" id="fullBtn" title="Tela cheia">⛶ <span>Tela cheia</span></button></div>
    </header>
    <main class="workspace" id="workspace" aria-label="Salão do jogo">
      <div id="stage" role="group" aria-label="Mapa do salão DDTank"></div>
    </main>
    <footer class="bottom-bar"><div id="status" role="status" aria-live="polite">Preparando salão…</div><div class="footer-tip">Clique nos locais • Tab para navegar • Esc para fechar</div></footer>
  </div>
  <div id="dialogBackdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
      <button id="closeDialog" class="close-dialog" type="button" aria-label="Fechar">✕</button>
      <span class="dialog-eyebrow">LOCAL SELECIONADO</span><h2 id="dialogTitle"></h2>
      <p id="dialogDescription"></p>
      <div class="dialog-note">Esta versão reproduz a interface visual. Para abrir o módulo real, é necessário conectar sua implementação do jogo.</div>
      <button id="confirmDialog" type="button" class="primary">Entendi</button>
    </section>
  </div>
  <script src="js/config.js"></script><script src="js/hall.js"></script>
</body>
</html>
